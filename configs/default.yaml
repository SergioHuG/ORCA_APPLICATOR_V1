# configs/default.yaml
# V1 configuration matching apply_test_kinematic_then_haptic_soft_bumper_V1 behavior

serial:
  port: /dev/orca0
  baudrate: 1000000
  interframe_us: 80

loop:
  # Target high-speed control loop rate (stream_cache reads)
  control_hz: 250

motion:
  # HOME is computed as (pos_after_autozero + home_offset_um)
  home_offset_um: 15000

  # Motion IDs
  motion_home_id: 0
  motion_return_id: 1
  motion_apply_id: 2

  # Kinematic motion type: 1=min jerk
  kin_type_min_jerk: 1

  # Timing (ms)
  motion_home_time_ms: 500
  motion_return_time_ms: 200
  apply_time_ms: 350

  # Apply travel
  apply_travel_um: 200000

  # Enter haptics this far before the apply limit
  haptic_before_limit_um: 150000

contact:
  # Contact detection threshold (delta from baseline)
  contact_rise_mN: 3000

haptics:
  # Spring bumper
  spring_gain: 200
  spring_dead_zone: 0
  spring_sat_n: 10

  # Damper
  damper_gain: 700

timeouts:
  autozero_timeout_s: 60.0
  home_timeout_s: 10.0
  return_timeout_s: 10.0

tolerances:
  home_tol_um: 800

logging:
  log_dir: logs
  csv_prefix: apply_kin_then_haptic

gpio:
  enabled: true

  backend: pigpio
  pigpio_host: localhost

  autozero:
    pin: 5
    pull_up: true
    bounce_time_s: 0.05     # human input debounce (gpiozero)
    lockout_ms: 300         # software lockout (safety)

  apply:
    pin: 6
    pull_up: true
    bounce_time_s: null     # fastest edge response
    lockout_ms: 150         # software lockout (safety)




behavior:
  # New desired sequencing:
  # - On boot (or later when triggered by GPIO) do AutoZero -> Home.
  # - Then idle and wait for an APPLY trigger.
  autozero_home_on_boot: true


# -----------------------------------------------------------------------
# V2 label applicator — technical-note haptic-only architecture
#
# All three springs + damper are configured once after AutoZero and left
# running.  Runtime state changes are made exclusively via set_constant_force().
# No kinematic motions are used after the initial home sequence.
#
# Positions marked "(offset from home_um)" are added to the AutoZero-derived
# home position at runtime to compute absolute motor positions.
#
# apply_force_mN is computed automatically:
#   apply_force_mN = target_contact_force_mN - gravity_mN
# Do NOT set apply_force_mN here; edit target_contact_force_mN / gravity_mN.
# -----------------------------------------------------------------------
label_applicator:

  # --- Force parameters ---
  # target_contact_force_mN: total desired downward force at label surface (mN).
  #   This is the SUM of motor contribution and gravity:
  #   apply_force_mN (motor) + gravity_mN = target_contact_force_mN
  # gravity_mN: gravitational contribution of the shaft (shaft mass * g, in mN).
  #   Shaft-down orientation means gravity already drives the apply stroke, so the
  #   motor only needs to supply the remainder (apply_force_mN = target - gravity).
  #
  # Example (matching technical note): target=40000, gravity=20000 -> apply_force=20000
  # Measure gravity_mN by reading force_mN in SleepMode with shaft hanging free.
  target_contact_force_mN: 40000
  gravity_mN: 20000

  # --- Position offsets (from home_um) ---
  # extended_position_offset_um: distance to the apply target / Spring B center.
  #   Also used as the position threshold in contact detection.
  # spring_c_position_offset_um: center of the Spring C slingshot effect.
  #   Must be strictly between 0 and extended_position_offset_um.
  extended_position_offset_um: 180000
  spring_c_position_offset_um: 90000

  # --- Spring A — home bumper (coupling: both directions) ---
  # Centered at home_um.  Holds shaft at rest; provides return restoring force.
  spring_a_gain: 500
  spring_a_dead_zone: 0
  spring_a_saturation_mN: 60000

  # --- Spring B — end-of-travel guard (coupling: both directions) ---
  # Centered at home_um + extended_position_offset_um.
  spring_b_gain: 500
  spring_b_dead_zone: 0
  spring_b_saturation_mN: 60000

  # --- Spring C — fast-travel slingshot (coupling: positive only) ---
  # Centered at home_um + spring_c_position_offset_um.
  # Only pushes toward extension; does not resist retraction.
  spring_c_gain: 200
  spring_c_dead_zone: 0
  spring_c_saturation_mN: 30000

  # --- Damper ---
  damper_gain: 300

  # --- Contact detection (three-condition check) ---
  # Trigger when ALL of:
  #   |force - apply_force_mN| <= force_detection_envelope_mN
  #   |velocity|               <= stopped_velocity_um_s
  #   position                 <  home_um + extended_position_offset_um
  stopped_velocity_um_s: 1000
  force_detection_envelope_mN: 5000

  # --- State timing ---
  # How long (ms) to hold in HOLD_CONTACT before writing set_constant_force(0).
  hold_contact_duration_ms: 500